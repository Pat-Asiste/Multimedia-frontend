<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Acción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🎬 Catálogo de Películas de Acción</h1>
    <input
        type="text"
        id="buscador"
        placeholder="Buscar película..."
        aria-label="Buscar película"
    >
</header>

<main>
    <!-- El contenedor se poblará dinámicamente desde JavaScript -->
    <section class="catalogo" id="catalogo"></section>

    <p id="sin-resultados" class="sin-resultados">
        No se encontraron películas que coincidan con tu búsqueda.
    </p>
</main>

<footer>
    <p>Mi servidor de películas · Catálogo local</p>
</footer>

<script src="script.js"></script>
</body>
</html>
