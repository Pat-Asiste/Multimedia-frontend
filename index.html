<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Películas de Acción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🎬 Catálogo de Películas de Acción</h1>
    <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar película..."
    >
</header>

<main>
    <section class="catalogo" id="catalogo"></section>

    <p id="sin-resultados" class="sin-resultados">
        No se encontraron películas que coincidan con tu búsqueda.
    </p>
</main>

<footer>
    <p>Mi servidor de películas · Catálogo local</p>
</footer>

<script src="script.js"></script>
</body>
</html>
